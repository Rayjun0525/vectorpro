[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorpro"
version = "0.0.1"
description = "Vector programs executed by learned, verifiable state-transition cells."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.scripts]
vectorpro = "vectorpro.__main__:main"
vectorpro-agent = "vectorpro.agent:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
catalog = ["transformers>=4.57,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
